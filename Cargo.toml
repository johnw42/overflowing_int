[package]
name = "compact_bigint"
version = "0.1.0"
authors = ["John Williams <jrw@pobox.com>"]
edition = "2018"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
#default = ["tiny_digit"]
default = ["i128_digit"]
unsafe_encoding = []
i128_digit = []
tiny_digit = []
debug_structure = []

[dependencies]
num-bigint = "0.3"
num-traits = "0.2.12"
num-integer = "0.1.43"
expand_macro = {path = "../expand_macro"}

[dev-dependencies]
rand = "0.7.3"
criterion = "0.3.3"
num = "0.3.0"
num-bigint = {version="0.3", features=["rand"]}

[[bench]]
name = "benchmark"
harness = false